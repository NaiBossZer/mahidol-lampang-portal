name: Apply Drive form status labels

on:
  push:
    branches:
      - fix/activity-management-review
    paths:
      - '.github/workflows/_apply-drive-form-status.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activity-management-review
          fetch-depth: 1
      - name: Translate status labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/ActivitiesManagementPage.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<option value="draft">Draft</option>', '<option value="draft">ร่าง</option>')
          s = s.replace('<option value="published">Published</option>', '<option value="published">เผยแพร่</option>')
          s = s.replace('<option value="archived">Archived</option>', '<option value="archived">เก็บถาวร</option>')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/ActivitiesManagementPage.tsx
          git diff --cached --quiet || git commit -m 'fix(admin): translate activity status labels'
          git push origin HEAD:fix/activity-management-review
