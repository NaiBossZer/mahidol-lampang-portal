name: Portal Quality Gate

on:
  push:
    branches: [main, qa/dashboard-visual, refactor/5-domain-architecture]
  pull_request:
    branches: [main, phase-6-dashboard-normalization]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply respondent-level report fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/ExecutiveDashboardPage.tsx')
          s = p.read_text()

          # Remove stale AI Insights JSX left on the executive dashboard.
          marker = '    {/* AI Insights Panel */}\n'
          if marker in s:
              start = s.index(marker)
              end = s.index('    <div className="grid grid-cols-1 items-start gap-3 lg:grid-cols-12">', start)
              s = s[:start] + s[end:]

          # CSV: exactly one row per filtered response.
          old = 'const headers = ["กิจกรรม", "วันที่กิจกรรม", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]; const rows = filteredReportRows.map(r => [r.activity, formatDate(r.date), formatDateTime(r.submittedAt), r.ageGroup, r.affiliation, r.organization,'
          new = 'const headers = ["รหัสผู้ตอบ", "กิจกรรม", "วันที่กิจกรรม", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]; const rows = filteredReportRows.map(r => [r.id, r.activity, formatDate(r.date), formatDateTime(r.submittedAt), r.ageGroup, r.affiliation, r.organization,'
          if old not in s: raise SystemExit('CSV respondent mapping not found')
          s = s.replace(old, new, 1)

          # Print: same filtered response dataset, with the same respondent ID.
          old = 'const headers = ["#", "กิจกรรม", "วันที่กิจกรรม", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]; const body = filteredReportRows.map((r, i) => `<tr><td>${i + 1}</td><td>${printCell(r.activity)}</td>'
          new = 'const headers = ["#", "รหัสผู้ตอบ", "กิจกรรม", "วันที่กิจกรรม", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]; const body = filteredReportRows.map((r, i) => `<tr><td>${i + 1}</td><td>${printCell(r.id)}</td><td>${printCell(r.activity)}</td>'
          if old not in s: raise SystemExit('Print respondent mapping not found')
          s = s.replace(old, new, 1)

          # Visible report table: make respondent identity explicit.
          old = '["#", "กิจกรรม", "วันที่จัด", "ผู้ตอบ", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]'
          new = '["#", "รหัสผู้ตอบ", "กิจกรรม", "วันที่จัด", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]'
          if old not in s: raise SystemExit('Visible report header not found')
          s = s.replace(old, new, 1)
          old = '{[i + 1, r.activity, formatDate(r.date), formatDateTime(r.submittedAt), r.ageGroup, r.affiliation, r.organization,'
          new = '{[i + 1, r.id, r.activity, formatDate(r.date), formatDateTime(r.submittedAt), r.ageGroup, r.affiliation, r.organization,'
          if old not in s: raise SystemExit('Visible report row not found')
          s = s.replace(old, new, 1)
          s = s.replace('j >= 7 && j < 7 + ALL_SCORE_FIELDS.length', 'j >= 8 && j < 8 + ALL_SCORE_FIELDS.length', 1)
          s = s.replace('j >= 7 + ALL_SCORE_FIELDS.length', 'j >= 8 + ALL_SCORE_FIELDS.length', 1)
          s = s.replace('colSpan={7 + ALL_SCORE_FIELDS.length + 2}', 'colSpan={8 + ALL_SCORE_FIELDS.length + 2}', 1)

          # Search includes respondent code as well.
          old = '[r.activity, r.ageGroup, r.affiliation, r.organization, r.feedback, r.channels, ...ALL_SCORE_FIELDS.map(f => r.scores[f])]'
          new = '[r.id, r.activity, r.ageGroup, r.affiliation, r.organization, r.feedback, r.channels, ...ALL_SCORE_FIELDS.map(f => r.scores[f])]'
          if old in s: s = s.replace(old, new, 1)

          s = s.replace('<Modal title="รายงานผลสัมฤทธิ์รวมทุกกิจกรรม (Executive Summary)"', '<Modal title={`ตารางข้อมูลผู้ตอบแบบประเมินรายบุคคล • ${filteredReportRows.length.toLocaleString("th-TH")} รายการ`}', 1)

          if 'aiInsights' in s or 'AIPerformanceFeedbackModal' in s or 'Sparkles' in s:
              raise SystemExit('stale AI Insights references remain')
          if 'const headers = ["#", "กิจกรรม", "วันที่จัด", "ผู้ตอบ"' in s:
              raise SystemExit('old visible respondent table remains')
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/ExecutiveDashboardPage.tsx .github/workflows/quality.yml
          git rm .github/workflows/fix-ai-insights-reference.yml qa/.respondent-export-trigger 2>/dev/null || true
          git checkout HEAD -- .github/workflows/quality.yml
          git add src/pages/admin/ExecutiveDashboardPage.tsx
          git commit -m "fix: make dashboard report exports respondent-level" || true
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke
