name: Cleanup duplicate report detail

on:
  push:
    branches:
      - feat/move-ai-insights-to-activities

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/move-ai-insights-to-activities
          fetch-depth: 1
      - name: Remove duplicate report detail declaration
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("src/pages/admin/ExecutiveDashboardPage.tsx")
          s = p.read_text(encoding="utf-8")
          pattern = re.compile(r'  const reportDetailRows = useMemo<ReportDetailRow\[\]>(?:.|\\n)*?\[filteredReportRows\]\);\\n', re.S)
          matches = list(pattern.finditer(s))
          if len(matches) < 2:
              print(f"reportDetailRows declarations found: {len(matches)}; no cleanup needed")
          else:
              s = s[:matches[0].end()] + s[matches[1].end():]
              p.write_text(s, encoding="utf-8")
              print("Removed duplicate reportDetailRows declaration")
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/ExecutiveDashboardPage.tsx .github/workflows/cleanup-duplicate-report-detail.yml
          git commit -m "fix: remove duplicate respondent question export declaration" || exit 0
          git rm .github/workflows/cleanup-duplicate-report-detail.yml
          git commit -m "chore: remove temporary report export cleanup"
          git push origin HEAD:feat/move-ai-insights-to-activities
