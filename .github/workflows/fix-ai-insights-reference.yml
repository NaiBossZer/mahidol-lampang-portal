name: Cleanup AI Insights Dashboard Reference
on:
  push:
    branches: [feat/move-ai-insights-to-activities]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale AI Insights JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/ExecutiveDashboardPage.tsx')
          lines = p.read_text().splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines) if line.strip() == '{aiInsights && ('), None)
          if start is None:
              raise SystemExit('stale AI Insights JSX start not found')
          end = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == ')}'), None)
          if end is None:
              raise SystemExit('stale AI Insights JSX end not found')
          del lines[start:end + 1]
          s = ''.join(lines)
          p.write_text(s)
          for token in ('aiInsights', 'Sparkles', 'AIPerformanceFeedbackModal'):
              if token in s:
                  raise SystemExit(f'stale AI Insights reference remains: {token}')
          print(f'removed stale JSX lines {start + 1}-{end + 1}')
          PY
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ai-insights-reference.yml
          git add src/pages/admin/ExecutiveDashboardPage.tsx
          git commit -m "fix: remove stale AI insights dashboard reference"
          git push
