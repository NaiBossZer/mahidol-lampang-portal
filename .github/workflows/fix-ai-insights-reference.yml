name: Cleanup AI Insights Dashboard Reference
on:
  push:
    branches: [feat/move-ai-insights-to-activities]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix respondent-level report exports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/ExecutiveDashboardPage.tsx')
          s = p.read_text()

          replacements = [
              ('const headers = ["กิจกรรม", "วันที่กิจกรรม", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]; const rows = filteredReportRows.map(r => [r.activity, formatDate(r.date), formatDateTime(r.submittedAt), r.ageGroup, r.affiliation, r.organization,',
               'const headers = ["รหัสผู้ตอบ", "กิจกรรม", "วันที่กิจกรรม", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]; const rows = filteredReportRows.map(r => [r.id, r.activity, formatDate(r.date), formatDateTime(r.submittedAt), r.ageGroup, r.affiliation, r.organization,'),
              ('const headers = ["#", "กิจกรรม", "วันที่กิจกรรม", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]; const body = filteredReportRows.map((r, i) => `<tr><td>${i + 1}</td><td>${printCell(r.activity)}</td>',
               'const headers = ["#", "รหัสผู้ตอบ", "กิจกรรม", "วันที่กิจกรรม", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]; const body = filteredReportRows.map((r, i) => `<tr><td>${i + 1}</td><td>${printCell(r.id)}</td><td>${printCell(r.activity)}</td>'),
              ('["#", "กิจกรรม", "วันที่จัด", "ผู้ตอบ", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]',
               '["#", "รหัสผู้ตอบ", "กิจกรรม", "วันที่จัด", "วันที่ส่งแบบประเมิน", "ช่วงอายุ", "ประเภทผู้ตอบ", "หน่วยงาน", ...ALL_SCORE_FIELDS.map(f => SCORE_LABELS[f]), "ความคิดเห็น", "ช่องทางการรับรู้"]'),
              ('{[i + 1, r.activity, formatDate(r.date), formatDateTime(r.submittedAt), r.ageGroup, r.affiliation, r.organization,',
               '{[i + 1, r.id, r.activity, formatDate(r.date), formatDateTime(r.submittedAt), r.ageGroup, r.affiliation, r.organization,'),
              ('j >= 7 && j < 7 + ALL_SCORE_FIELDS.length', 'j >= 8 && j < 8 + ALL_SCORE_FIELDS.length'),
              ('j >= 7 + ALL_SCORE_FIELDS.length', 'j >= 8 + ALL_SCORE_FIELDS.length'),
              ('colSpan={7 + ALL_SCORE_FIELDS.length + 2}', 'colSpan={8 + ALL_SCORE_FIELDS.length + 2}'),
              ('[r.activity, r.ageGroup, r.affiliation, r.organization, r.feedback, r.channels, ...ALL_SCORE_FIELDS.map(f => r.scores[f])]', '[r.id, r.activity, r.ageGroup, r.affiliation, r.organization, r.feedback, r.channels, ...ALL_SCORE_FIELDS.map(f => r.scores[f])]'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected fragment not found: {old[:100]}')
              s = s.replace(old, new, 1)

          if 'r.id, r.activity' not in s or 'printCell(r.id)' not in s:
              raise SystemExit('Respondent ID was not wired into report outputs')
          p.write_text(s)
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/ExecutiveDashboardPage.tsx
          git rm .github/workflows/fix-ai-insights-reference.yml
          git commit -m "fix: make dashboard report exports respondent-level"
          git push