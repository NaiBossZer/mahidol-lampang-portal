name: Remove duplicate report detail

on:
  push:
    branches:
      - feat/move-ai-insights-to-activities

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/move-ai-insights-to-activities
          fetch-depth: 1
      - name: Remove duplicate declaration
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/pages/admin/ExecutiveDashboardPage.tsx")
          s = p.read_text(encoding="utf-8")
          needle = "  const reportDetailRows = useMemo<ReportDetailRow[]>(() =>"
          first = s.find(needle)
          second = s.find(needle, first + 1)
          if first == -1 or second == -1:
              raise SystemExit(f"Expected duplicate declarations, found first={first}, second={second}")
          end = s.find("\n  const exportCSV = () =>", second)
          if end == -1:
              raise SystemExit("Could not find exportCSV after duplicate declaration")
          s = s[:second] + s[end:]
          p.write_text(s, encoding="utf-8")
          print("Removed second reportDetailRows declaration")
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/ExecutiveDashboardPage.tsx .github/workflows/remove-duplicate-report-detail.yml
          git commit -m "fix: remove duplicate respondent question export declaration"
          git rm .github/workflows/remove-duplicate-report-detail.yml
          git commit -m "chore: remove temporary duplicate cleanup"
          git push origin HEAD:feat/move-ai-insights-to-activities
