name: Prepare Material Symbols binary

on:
  push:
    branches:
      - fix/material-symbols-reliable-font

permissions:
  contents: write

jobs:
  prepare-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned Material Symbols font
        run: |
          mkdir -p public/fonts
          curl -fL --retry 3 --retry-all-errors \
            https://unpkg.com/material-symbols@0.47.3/material-symbols-outlined.woff2 \
            -o public/fonts/material-symbols-outlined.woff2
          test -s public/fonts/material-symbols-outlined.woff2

      - name: Commit font binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fonts/material-symbols-outlined.woff2
          if git diff --cached --quiet; then
            echo "Font binary already committed."
          else
            git commit -m "chore: add Material Symbols font binary"
            git push
          fi
