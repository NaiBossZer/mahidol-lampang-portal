name: Temporary Dashboard Report Label Fix

on:
  push:
    branches: [fix/dashboard-content-branding]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update report modal organization label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/pages/admin/ExecutiveDashboardPage.tsx")
          text = path.read_text(encoding="utf-8")
          old = "คณะสิ่งแวดล้อมและทรัพยากรศาสตร์ มหาวิทยาลัยมหิดล วิทยาเขตลำปาง"
          new = "งานพันธกิจเพื่อสังคม คณะสิ่งแวดล้อมและทรัพยากรศาสตร์ มหาวิทยาลัยมหิดล"
          count = text.count(old)
          if count:
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print(f"replaced {count} occurrence(s)")
          else:
              print("no matching legacy report label")
          Path(".github/workflows/temporary-dashboard-report-label.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align dashboard report modal branding"
          git push origin HEAD:fix/dashboard-content-branding
