name: Resolve Activity Report Branch

on:
  push:
    branches:
      - fix/activity-report-hero-fit

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync main and reapply intended changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main -m "chore: sync branch with main" || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            git checkout --theirs src/pages/admin/ExecutiveDashboardPage.tsx
            git add src/pages/admin/ExecutiveDashboardPage.tsx
            git commit -m "chore: resolve activity report merge conflict" || true
          fi
          python - <<'PY'
          from pathlib import Path
          files = [Path("src/pages/admin/ExecutiveDashboardPage.tsx"), Path("src/App.tsx")]
          old = "รายงานผลสัมฤทธิ์รายกิจกรรม"
          new = "รายงานผลสัมฤทธิ์ทั้งหมด"
          for path in files:
              text = path.read_text(encoding="utf-8")
              text = text.replace(old, new)
              if path.name == "ExecutiveDashboardPage.tsx":
                  target = 'className="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"'
                  replacement = 'className="h-full w-full object-contain transition-transform duration-300 group-hover:scale-105"'
                  text = text.replace(target, replacement, 1)
              path.write_text(text, encoding="utf-8")
          PY
          git add src/pages/admin/ExecutiveDashboardPage.tsx src/App.tsx
          git commit -m "fix: fit activity hero image and rename report" || true
          git push origin HEAD:fix/activity-report-hero-fit
