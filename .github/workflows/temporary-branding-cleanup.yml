name: Temporary Branding Cleanup

on:
  push:
    branches: [fix/dashboard-content-branding]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct branding fallbacks and report label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "functions/api/admin/ai-document-analysis.ts": [
                  (
                      'activity.location || "งานพันธกิจเพื่อสังคม คณะสิ่งแวดล้อมและทรัพยากรศาสตร์ มหาวิทยาลัยมหิดล"',
                      'activity.location || "มหาวิทยาลัยมหิดล วิทยาเขตลำปาง"',
                  ),
              ],
              "functions/api/admin/ai-survey-generate.ts": [
                  (
                      'activity.location || "งานพันธกิจเพื่อสังคม คณะสิ่งแวดล้อมและทรัพยากรศาสตร์ มหาวิทยาลัยมหิดล"',
                      'activity.location || "มหาวิทยาลัยมหิดล วิทยาเขตลำปาง"',
                  ),
              ],
              "functions/api/admin/ai-post-project.ts": [
                  (
                      'activity.location || "งานพันธกิจเพื่อสังคม คณะสิ่งแวดล้อมและทรัพยากรศาสตร์ มหาวิทยาลัยมหิดล"',
                      'activity.location || "มหาวิทยาลัยมหิดล วิทยาเขตลำปาง"',
                  ),
              ],
              "src/components/admin/ExecutiveReportOverride.tsx": [
                  (
                      'คณะสิ่งแวดล้อมและทรัพยากรศาสตร์ งานพันธกิจเพื่อสังคม คณะสิ่งแวดล้อมและทรัพยากรศาสตร์ มหาวิทยาลัยมหิดล',
                      'งานพันธกิจเพื่อสังคม คณะสิ่งแวดล้อมและทรัพยากรศาสตร์ มหาวิทยาลัยมหิดล',
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count:
                      text = text.replace(old, new)
                      print(f"{name}: replaced {count} occurrence(s)")
              path.write_text(text, encoding="utf-8")

          path = Path(".github/workflows/temporary-branding-cleanup.yml")
          path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve physical location wording"
          git push origin HEAD:fix/dashboard-content-branding
