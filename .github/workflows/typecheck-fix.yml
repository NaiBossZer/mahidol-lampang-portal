name: Apply typecheck fix

on:
  push:
    branches:
      - fix/typecheck-4-errors

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining report state type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/pages/admin/AIStudioOutcomeWorkspacePage.tsx")
          s = p.read_text()
          s = s.replace(
              'import { generateAiPostProjectReport } from "@/services/admin-ai-workflow";',
              'import { generateAiPostProjectReport, type PostProjectReport } from "@/services/admin-ai-workflow";'
          )
          s = s.replace(
              'const [report, setReport] = useState<{ summary: string; content: string; performanceResults: string; outcomesAndImpact: string; satisfactionPercent?: number; responseCount?: number } | null>(null);',
              'const [report, setReport] = useState<PostProjectReport | null>(null);'
          )
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          npm run typecheck
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AIStudioOutcomeWorkspacePage.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: resolve remaining report typecheck error"
            git push
          fi
