name: Temporary typecheck fix
on:
  push:
    branches: [fix/typecheck-4-errors]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal TypeScript fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/AIStudioOutcomeWorkspacePage.tsx')
          s = p.read_text()
          s = s.replace('import { generateAiPostProjectReport } from "@/services/admin-ai-workflow";', 'import {\n  generateAiPostProjectReport,\n  type PostProjectReport,\n} from "@/services/admin-ai-workflow";')
          old = 'const [report, setReport] = useState<{ summary: string; content: string; performanceResults: string; outcomesAndImpact: string; satisfactionPercent?: number; responseCount?: number } | null>(null);'
          new = 'const [report, setReport] = useState<PostProjectReport | null>(null);'
          if old not in s:
              raise SystemExit('Expected report state declaration not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify typecheck
        run: npm run typecheck
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/AIStudioOutcomeWorkspacePage.tsx
          git commit -m 'fix: resolve PostProjectReport nullability typecheck'
          git push
